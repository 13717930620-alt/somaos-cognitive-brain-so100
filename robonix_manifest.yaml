manifestVersion: 1
name: somaos-cognitive-brain-humanoid-sim-deploy
catalog:
  name: robonix.robot.somaos.cognitive_brain_humanoid_sim
  version: 1.1.0
  description: >
    SomaOS Cognitive Brain — a bionically partitioned cognitive-intelligence
    robot brain targeting bipedal humanoid robots. Provides natural-language
    task understanding, multi-modal perception, semantic and episodic memory,
    deliberative reasoning with meta-cognitive layers, consciousness-gated
    motor control, and a dual-redundancy safety stack. Designed for deployment
    on GPU-grade single-board or desktop x86+accelerator platforms.
    Validation status: SIMULATION ONLY — the scheduling and
    perceive-decide loops are validated in simulation; the entry has NOT run
    on a real humanoid robot yet (real-robot integration is in progress).
    Distributed as a closed-source compiled binary runtime (downloadable
    from GitHub Release) and a closed-source container; sources and model
    weights are not published. Runnable demo packages are included in this
    repository.
  license: MulanPSL-2.0
  tags:
    - robot
    - deploy
    - humanoid
    - simulation_validated
    - cognitive_brain
    - bionic_architecture
    - multi_modal
    - safety
    - meta_cognition
    - local_llm
    - whole_body_control
  maintainers:
    - SomaOS Brain Team <gm@jxt.asia>

primitive:
  - name: task_priority_scheduler
    path: ./demos/task_priority
    config:
      mode: demo
      seed: 7
      ticks: 40
  - name: perceive_decide_loop
    path: ./demos/perceive_decide
    config:
      mode: demo
      seed: 11
      frames: 24

service:
  - name: somaos_cognitive_runtime
    path: ./docker
    config:
      delivery: closed_source_container
      container: ghcr.io/13717930620-alt/somaos-cognitive-brain:latest
      sources_published: false
      weights_published: false
  - name: somaos_cognitive_binary_runtime
    path: ./
    config:
      delivery: closed_source_binary
      release: https://github.com/13717930620-alt/somaos-cognitive-brain-so100/releases/tag/v1.0.0-bin
      entry: node loader.js health
      sources_published: false
      weights_published: false

skill:
  - name: reflex_safe_hold
    path: ./demos/perceive_decide
    config:
      mode: demo

capabilities:
  - name: robonix/primitive/camera/rgb
  - name: robonix/primitive/camera/depth
  - name: robonix/primitive/audio/speech_in
  - name: robonix/primitive/audio/speech_out
  - name: robonix/primitive/locomotion/walk
  - name: robonix/primitive/locomotion/balance
  - name: robonix/primitive/humanoid/move_to_pose
  - name: robonix/primitive/hand/grasp
  - name: robonix/primitive/hand/release
  - name: robonix/service/semantic_memory
  - name: robonix/service/episodic_memory
  - name: robonix/service/intent_understanding
  - name: robonix/service/motor_planning
  - name: robonix/primitive/safety/emergency_stop

deploy_dependencies:
  - name: robonix/primitive/camera
    version: ">=1.0.0"
  - name: robonix/primitive/audio
    version: ">=1.0.0"
  - name: robonix/primitive/locomotion
    version: ">=1.0.0"
  - name: robonix/primitive/humanoid
    version: ">=1.0.0"
  - name: robonix/service/semantic_memory
    version: ">=1.0.0"
  - name: robonix/service/episodic_memory
    version: ">=1.0.0"
  - name: robonix/primitive/safety
    version: ">=1.0.0"
